on:
    push:
        tags:
            - '0.*'
jobs:
    build:
        runs-on: docker
        steps:
            - uses: https://code.forgejo.org/actions/checkout@v6
            - run: apt-get update -qq
            - run: apt-get -q install -y -qq npm zip curl
            - uses: https://git.ryujinx.app/actions/setup-dotnet@v5
              with:
                dotnet-version: '9.0.x'
            - run: cp gex/env.template.json gex/env.json
            - run: cp gex/secrets.template.json gex/secrets.json
            - run: |
                cd gex
                npm install
                npm run build
            - run: |
                mkdir -p dist
                mkdir -p release_builds
            - run: echo "<Project><PropertyGroup><Version>${{ forgejo.ref_name }}</Version></PropertyGroup></Project>" > Directory.Build.props
            - run: dotnet publish gex/gex.sln -c PublishLinux
            - run: |
                cd gex/dist/linux-x64/
                zip -r ../../../release_builds/gex.Web_linux-x64.zip .
            - run: dotnet clean
            - run: dotnet publish gex/gex.sln -c PublishWindows
            - run: |
                cd gex/dist/win-x64/
                zip -r ../../../release_builds/gex.Web_win-x64.zip .
            - run: dotnet clean
            - run: dotnet publish gex.Coven/gex.Coven.csproj -c PublishLinux
            - run: rm gex.Coven/dist/linux-x64/UserOptions.json
            - run: |
                cd gex.Coven/dist/linux-x64/
                zip -r ../../../release_builds/gex.Coven_linux-x64.zip .
            - run: dotnet clean
            - run: dotnet publish gex.Coven/gex.Coven.csproj -c PublishWindows
            - run: rm gex.Coven/dist/win-x64/UserOptions.json
            - run: |
                cd gex.Coven/dist/win-x64/
                zip -r ../../../release_builds/gex.Coven_win-x64.zip .
            - uses: https://code.forgejo.org/actions/forgejo-release@v2.5.0
              with:
                direction: upload
                release-dir: release_builds
                token: ${{ secrets.WRITE_TOKEN }}
                sha: ${{ forgejo.SHA }}
                tag: ${{ forgejo.ref_name }}
                override: true
                verbose: true

